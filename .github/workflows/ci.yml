name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        if: matrix.python == '3.12'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: |
          python -m pip install "uv==0.10.12"
          uv sync --locked --all-extras --python "${{ matrix.python }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint Python
        run: ruff check src tests

      - name: Run tests
        run: coverage run -m unittest discover -s tests

      - name: Report coverage
        run: coverage report

      - name: Evaluate review regression dataset
        run: python -m repo_review_agent.evaluation tests/fixtures/evaluation/dataset.json --min-precision 1 --output /tmp/evaluation.json

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Build frontend
        if: matrix.python == '3.12'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test frontend polling
        if: matrix.python == '3.12'
        working-directory: frontend
        run: npm test

      - name: Test frontend browser flows
        if: matrix.python == '3.12'
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build Docker image
        if: matrix.python == '3.12'
        run: docker build -t repo-review-agent:ci .

  database-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: repo_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install database test dependencies
        run: |
          python -m pip install "uv==0.10.12"
          uv sync --locked --extra database-test --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify migrations, RLS, atomic history and concurrent workers
        env:
          REPO_REVIEW_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/repo_review_test
        run: python -m unittest discover -s tests/integration -v
