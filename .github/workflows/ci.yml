name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install package
        run: python -m pip install -e ".[dev,langfuse]"

      - name: Lint Python
        run: ruff check src tests

      - name: Run tests
        run: coverage run -m unittest discover -s tests

      - name: Report coverage
        run: coverage report

      - name: Evaluate review regression dataset
        run: python -m repo_review_agent.evaluation tests/fixtures/evaluation/dataset.json --output /tmp/evaluation.json

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test frontend polling
        working-directory: frontend
        run: npm test

      - name: Test frontend browser flows
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Build Docker image
        run: docker build -t repo-review-agent:ci .

  database-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: repo_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install database test dependencies
        run: python -m pip install -e ".[database-test]"
      - name: Verify migrations, RLS, atomic history and concurrent workers
        env:
          REPO_REVIEW_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/repo_review_test
        run: python -m unittest discover -s tests/integration -v
