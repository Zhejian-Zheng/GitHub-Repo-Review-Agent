services:
  web:
    build: .
    restart: unless-stopped
    entrypoint:
      - repo-review-web
    env_file:
      - .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-GitHub Repo Review Agent}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      REPO_REVIEW_ALLOW_LOCAL_TARGETS: ${REPO_REVIEW_ALLOW_LOCAL_TARGETS:-false}
      REPO_REVIEW_RATE_LIMIT_PER_MINUTE: ${REPO_REVIEW_RATE_LIMIT_PER_MINUTE:-30}
      REPO_REVIEW_MAX_FILES_LIMIT: ${REPO_REVIEW_MAX_FILES_LIMIT:-1000}
      REPO_REVIEW_MAX_FILE_SIZE_LIMIT: ${REPO_REVIEW_MAX_FILE_SIZE_LIMIT:-1000000}
      REPO_REVIEW_CORS_ORIGINS: ${REPO_REVIEW_CORS_ORIGINS:-}
      REPO_REVIEW_REQUIRE_AUTH: ${REPO_REVIEW_REQUIRE_AUTH:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
