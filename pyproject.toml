[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-review-agent"
version = "0.1.0"
description = "A lightweight repository review agent that generates architecture summaries, risk reports, and issue suggestions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Zhejian Zheng" }
]
keywords = ["ai-agent", "code-review", "static-analysis", "github", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
repo-review = "repo_review_agent.cli:main"
repo-review-web = "repo_review_agent.web:main"
repo-review-mcp = "repo_review_agent.mcp_server:main"
repo-review-pr-bot = "repo_review_agent.pr_bot:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
mcp = [
  "mcp>=1.0",
]
all = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0",
]
dev = [
  "coverage[toml]>=7.6",
  "ruff>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["repo_review_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
