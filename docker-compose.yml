services:
  repo-review:
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-GitHub Repo Review Agent}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - .:/workspace:ro
      - ./reports:/reports
    command:
      - /workspace
      - --agent
      - --output
      - /reports/review-report.md
      - --json
      - /reports/review-report.json

  web:
    profiles:
      - web
    build: .
    entrypoint:
      - repo-review-web
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-GitHub Repo Review Agent}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      REPO_REVIEW_ALLOW_LOCAL_TARGETS: ${REPO_REVIEW_ALLOW_LOCAL_TARGETS:-true}
      REPO_REVIEW_RATE_LIMIT_PER_MINUTE: ${REPO_REVIEW_RATE_LIMIT_PER_MINUTE:-0}
      REPO_REVIEW_MAX_FILES_LIMIT: ${REPO_REVIEW_MAX_FILES_LIMIT:-1000}
      REPO_REVIEW_MAX_FILE_SIZE_LIMIT: ${REPO_REVIEW_MAX_FILE_SIZE_LIMIT:-1000000}
    volumes:
      - .:/workspace:ro
    ports:
      - "8000:8000"
